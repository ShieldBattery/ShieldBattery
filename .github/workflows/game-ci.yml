name: Game CI

on:
  push:
    paths:
      - '*'
      - '!README.md'
      - '.github/**'
      - '.cargo/**'
      - 'tools/ci/**'
      - 'game/**'
      - 'tools/SB_INIT_BINARY_LICENSE.txt'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml
    with:
      component: game
      workflow-file: game-ci.yml

  clippy:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./game
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86
            target: '--target i686-pc-windows-msvc'
            display: 'x86'
          - name: x64
            target: '--target x86_64-pc-windows-msvc'
            display: 'x64'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./game

      - name: clippy ${{ matrix.display }}
        run: cargo clippy --all-targets --workspace ${{ matrix.target }} -- -D warnings

  fmt:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./game
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt
        run: cargo fmt --all -- --check

  licenses:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./game/Cargo.toml
          command: check licenses

  test:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./game
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86
            target: '--target i686-pc-windows-msvc'
            display: 'x86'
          - name: x64
            target: '--target x86_64-pc-windows-msvc'
            display: 'x64'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./game

      - name: cargo test ${{ matrix.display }}
        run: cargo test --all-targets --no-fail-fast ${{ matrix.target }}

  result:
    if: ${{ always() }}
    needs: [plan, clippy, fmt, licenses, test]
    uses: ./.github/workflows/ci-result.yml
    with:
      component: game
      workflow-file: game-ci.yml
      results: ${{ toJSON(needs) }}
