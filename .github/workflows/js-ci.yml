name: JS CI

on:
  push:
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml
    with:
      component: js
      workflow-file: js-ci.yml

  unit-tests:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Using pnpm
        uses: pnpm/action-setup@v4

      - name: Using Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./app

      - name: Run unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check for circular dependencies
        run: pnpm run check-circular

      - name: Check translation files
        id: check-translation-files
        run: pnpm gen-translations:app --ci && pnpm gen-translations:email --ci

      - name: Display translation error
        if: ${{ failure() && steps.check-translation-files.conclusion == 'failure' }}
        run: |
          echo '::error::Translation files are outdated. Run pnpm gen-translations.'
          exit 1

      - name: Generate email templates
        id: gen-email-templates
        run: pnpm gen-emails

      - name: Generate graphql files
        id: gen-graphql
        run: pnpm gen-graphql

      - name: Check email templates
        id: check-email-templates
        run: echo "matches=$(git status --porcelain -- 'server/email/*.html' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Display email template error
        if: ${{ steps.check-email-templates.outputs.matches != '' || failure() && steps.gen-email-templates.conclusion == 'failure' }}
        run: |
          echo '::error::Email templates are outdated. Run pnpm gen-emails.'
          exit 1

      - name: Check graphql codegen
        id: check-graphql
        run: echo "matches=$(git status --porcelain -- 'client/gql/*' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Display graphql error
        if: ${{ steps.check-graphql.outputs.matches != '' || failure() && steps.gen-graphql.conclusion == 'failure' }}
        run: |
          echo '::error::Generated GraphQL files are outdated. Run pnpm gen-graphql.'
          exit 1

  integration-tests:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: Build app-server container
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app_server:latest
          cache-from: type=gha,scope=app-server
          cache-to: type=gha,mode=max,scope=app-server

      - name: Build server-rs container
        uses: docker/build-push-action@v6
        with:
          context: ./server-rs
          load: true
          tags: integration-server-rs:latest
          cache-from: type=gha,scope=server-rs
          cache-to: type=gha,mode=max,scope=server-rs

      - name: Running Docker containers
        run: cd ./integration && docker compose up -V -d

      - name: Using pnpm
        uses: pnpm/action-setup@v4

      - name: Using Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./app

      # Only the headless Chromium the tests run, without --with-deps: the runner image already has
      # its system libraries, and the apt install of every browser's dependencies (~140 MB) crawls
      # for up to an hour whenever the Ubuntu mirror is slow.
      - name: Install playwright browser
        run: pnpm exec playwright install --only-shell chromium
        timeout-minutes: 5

      - name: Run integration tests
        run: pnpm test:integration

      - name: View app-server logs
        if: ${{ failure() }}
        run: docker logs integration-app-server-1

      - name: View server-rs logs
        if: ${{ failure() }}
        run: docker logs integration-server-rs-1

      - name: View mailgun logs
        if: ${{ failure() }}
        run: docker logs integration-mailgun-1

      - name: View google-cloud logs
        if: ${{ failure() }}
        run: docker logs integration-google-cloud-1

      - uses: actions/upload-artifact@v4
        if: ${{ failure() || success() }}
        with:
          name: test-results
          path: ./test-results/*
          retention-days: 5
          if-no-files-found: ignore

  result:
    if: ${{ always() }}
    needs: [plan, unit-tests, integration-tests]
    uses: ./.github/workflows/ci-result.yml
    with:
      component: js
      workflow-file: js-ci.yml
      results: ${{ toJSON(needs) }}
