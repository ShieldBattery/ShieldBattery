name: server-rs CI

on:
  push:
    paths:
      - '*'
      - '!README.md'
      - '.github/**'
      - '.cargo/**'
      - 'tools/ci/**'
      - 'server-rs/**'
      - 'migrations/**'
      - 'deployment/**'
      - 'common/typeshare.ts'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml
    with:
      component: server-rs
      workflow-file: server-rs-ci.yml

  clippy:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server-rs
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./server-rs

      - name: clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

  fmt:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server-rs
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt
        run: cargo fmt --all -- --check

  test:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server-rs
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./server-rs

      - name: cargo test
        run: cargo test --all-targets --no-fail-fast

      - name: cargo run --bin gen-schema
        id: gen-schema
        run: cargo run --bin gen-schema -- --fail-on-update

      - name: Display graphql error
        if: ${{ failure() && steps.gen-schema.conclusion == 'failure' }}
        run: |
          echo '::error::Generated GraphQL files are outdated. Run pnpm gen-schema and pnpm gen-graphql.'
          exit 1

  typeshare:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Using pnpm
        uses: pnpm/action-setup@v4

      - name: Using Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install typeshare-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: typeshare-cli

      - name: Run typeshare
        id: gen-typeshare
        run: pnpm gen-typeshare

      - name: Check typeshare
        id: check-typeshare
        run: echo "matches=$(git status --porcelain -- 'common/typeshare.ts' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Display typeshare
        if: ${{ steps.check-typeshare.outputs.matches != '' || failure() && steps.gen-typeshare.conclusion == 'failure' }}
        run: |
          git diff -- common/typeshare.ts
          echo '::error::Typeshare output is outdated. Run pnpm gen-typeshare.'
          exit 1

  sqlx-prepare:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server-rs
    strategy:
      fail-fast: false
    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/shieldbattery'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          SB_DB: shieldbattery
          SB_DB_USER: shieldbattery
          SB_DB_PASSWORD: shieldbattery
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./server-rs

      - name: Install sqlx-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: sqlx-cli

      - name: Get Postgres container ID
        id: get_postgres_id
        run: echo "CONTAINER_ID=$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)" >> $GITHUB_ENV

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            docker exec $CONTAINER_ID pg_isready && exit 0
            sleep 1
          done
          exit 1

      - name: Copy init script into container
        run: docker cp ../deployment/appserver/db/init-scripts/20200505-create-user-and-db.sh $CONTAINER_ID:/docker-entrypoint-initdb.d/20200505-create-user-and-db.sh

      - name: Run init script in container
        run: docker exec -u postgres $CONTAINER_ID bash /docker-entrypoint-initdb.d/20200505-create-user-and-db.sh

      - name: Run migrations
        run: cargo sqlx migrate run --source ../migrations

      - name: Check sqlx prepare
        run: cargo sqlx prepare --check --workspace -- --all-targets --all-features

  result:
    if: ${{ always() }}
    needs: [plan, clippy, fmt, test, typeshare, sqlx-prepare]
    uses: ./.github/workflows/ci-result.yml
    with:
      component: server-rs
      workflow-file: server-rs-ci.yml
      results: ${{ toJSON(needs) }}
