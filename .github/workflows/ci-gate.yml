# Decides whether a `push` run of a CI workflow should happen.
#
# Pushes to a pull request's branch already run CI through the `pull_request` event, so a push run
# there would only duplicate it. Push runs are wanted on the branches pull requests merge into (the
# default branch and any long-lived branch that is some pull request's base): they are the runs
# that save the caches every pull request targeting that branch restores from. GitHub scopes a
# cache to the ref that saved it, so a cache saved by a pull request or a feature branch is only
# readable by that same ref, while one saved on a base branch is readable by all of its pull
# requests.
#
# Calling workflows run this on `push` events only and skip their other jobs only when its `run`
# output is 'false'.
name: CI gate

on:
  workflow_call:
    outputs:
      run:
        description: "'true' if a push run on this ref should proceed, 'false' otherwise."
        value: ${{ jobs.check.outputs.run }}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether this push should run CI
        id: decide
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: $GITHUB_REF is not a branch."
            exit 0
          fi

          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running: $BRANCH is the default branch."
            exit 0
          fi

          # Fail open: an unneeded run costs less than a missing one.
          if ! count=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f base="$BRANCH" -f state=all -f per_page=1 --jq length); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running: could not look up pull requests targeting $BRANCH."
            exit 0
          fi

          if [ "$count" != "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running: $BRANCH is the base of a pull request."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: no pull request targets $BRANCH, and pull request runs cover its own pushes."
          fi
