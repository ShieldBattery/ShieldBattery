name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork PRs can't run this automatically: on pull_request events from forks, GitHub
    # withholds both OIDC tokens and repo secrets, so the action has no way to
    # authenticate. Use the workflow_dispatch trigger with a pr_number to review those.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}

            Review this pull request. The PR branch is already checked out. Project conventions
            live in CLAUDE.md / AGENTS.md (loaded automatically); a clear violation of them is
            reportable.

            ## Status reaction

            Use an emoji reaction on the PR description as a status light, via
            `gh api repos/${{ github.repository }}/issues/<PR NUMBER>/reactions`:
            - Before anything else: list the reactions, DELETE any left by you on earlier
              runs (by reaction id), then POST 👀 (`eyes`) to show the review is in
              progress.
            - When finished: DELETE your 👀, then POST 🎉 (`hooray`) if you're posting
              "gg, ship it". If you left findings, add no reaction — the comments are the
              signal.

            ## Prior reviews come first

            Before reviewing any code, fetch the existing feedback on this PR:
            - `gh pr view <PR NUMBER> --comments` for top-level comments and reviews
            - `gh api repos/${{ github.repository }}/pulls/<PR NUMBER>/comments` for inline
              review comments

            If this PR was already reviewed on an earlier revision:
            - Review only the commits pushed since that review (`gh pr diff` plus
              `git log`/`git diff` against the previously-reviewed commit). Don't re-review
              unchanged code you already looked at.
            - Never re-raise a finding that was already reported, already fixed, or that the
              author explicitly declined.
            - Hold the same bar as the first review. Fixing earlier findings does not lower
              the bar for new ones — a re-review that finds nothing new is the expected
              outcome for a push that addresses feedback, not a failure to do your job.

            ## What meets the bar

            Report a finding only if it falls into one of these:
            - Incorrect behavior: logic errors, race conditions, broken edge cases, misuse of
              an API or interface in a way that produces wrong results
            - Security problems: XSS, injection, auth bypass, data exposure
            - Data loss or corruption
            - Violations of the architecture rules or stated conventions in AGENTS.md
            - Departures from the established patterns of the surrounding code: introducing a
              new approach where the codebase has a settled one (state management, styling,
              error handling, file organization), hand-rolling something an existing project
              utility covers, or code whose style is clearly foreign to the file it lives in
            - Changes that will break the build or runtime as a set: DB migrations without
              regenerated SQLx metadata (`pnpm sqlx-prepare`), changed `server-rs/` resolvers
              without a regenerated schema, `common/ipc.ts` changes not reflected on both the
              `app/` and `client/` sides
            - Missing tests for new features or bug fixes — but don't flag legacy code that
              already lacked coverage

            Do NOT comment on matters of personal taste where the codebase has no settled
            pattern, naming or formatting nits in code that fits its surroundings, or
            speculative performance concerns. The standard for style and structure is
            consistency with this codebase, not your own preferences: if the PR matches how
            the surrounding code already does things, that aspect is fine even if you would
            have written it differently.
            There is no target number of comments — zero is a common and correct outcome, and
            it is better to post nothing than to post a borderline finding. Every comment
            costs the author a fix-and-push round trip; only spend that when the finding
            clearly pays for it.

            Changes to generated files are expected build output, not manual edits — never
            flag them: translation `global.json` files, `client/gql/`, `common/typeshare.ts`,
            `schema.graphql`.

            ## Verify before posting

            - Read enough surrounding code to be confident — for a localized change that may
              be just the enclosing function or module; scale reading to the diff rather than
              sweeping the repo
            - If the pattern exists elsewhere in the codebase, it's probably intentional
            - If you're unsure whether a finding is real, don't post it

            ## Findings, not patches

            The finding is the deliverable: state the problem, where it is, and its concrete
            consequence. Include a suggested fix only when you're confident it's correct
            given the actual imports, types, and surrounding code — an unverified fix is
            worse than no fix. If the real problem is the approach — a local patch would just
            be a band-aid — say so at the approach level in a top-level comment and describe
            what a better shape looks like, rather than proposing the band-aid.

            ## Posting

            - 1-3 sentences per finding
            - `mcp__github_inline_comment__create_inline_comment` for line-anchored findings
            - `gh pr comment` for approach-level feedback
            - Comment "gg, ship it" whenever the PR is ready to go as-is — nothing new to
              report and no earlier feedback still unaddressed — whether that's the first
              review or a re-review
            - If a re-review finds nothing new but earlier findings remain unaddressed,
              comment a single short line confirming you reviewed the new commits and
              noting what's still open

          claude_args: |
            --allowedTools "Read,Glob,Grep,WebFetch,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git blame:*)"
            --model "claude-opus-5"

      - name: Print formatted Claude transcript
        if: always() && steps.claude-review.outputs.execution_file != ''
        run: |
          npm install -g @khanacademy/format-claude-stream
          FILE="${{ steps.claude-review.outputs.execution_file }}"
          # execution_file may be a JSON array or already JSONL; normalize to JSONL
          if jq -e 'type == "array"' "$FILE" >/dev/null 2>&1; then
            jq -c '.[]' "$FILE" | format-claude-stream
          else
            format-claude-stream < "$FILE"
          fi
