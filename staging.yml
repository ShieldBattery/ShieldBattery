# The electron-builder config for the staging site (https://staging.shieldbattery.net)
# It should generally match the other build configs (except things that need to differ for this
# "region")
appId: net.shieldbattery.client.dev
extraResources:
  - game/dist/**
files:
  - 'assets/**/*'
  - 'dist/**/*'
  # Exclusions last: a later pattern wins, so these would be undone by the includes above.
  # node_modules is excluded because everything the app runs is bundled into dist/.
  - '!node_modules/**/*'
  - '!build/**/*'
  - '!**/*.map'
nsis:
  artifactName: '${productName}-setup-${version}.${ext}'
  # We disable oneClick for this config so that the install directory differs for this version
  oneClick: false
win:
  icon: icon.ico
  target: nsis
  signExts:
    - dll
  signtoolOptions:
    certificateSubjectName: Fast Expo Collective LLC
    # Signs via scsigntool so the YubiKey PIN is entered once per build instead of
    # once per signed file. See the hook for details.
    sign: ./tools/codesign/smartcard-sign.cjs
    publisherName:
      - Fast Expo Collective LLC
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://ts.ssl.com

# These properties differ between configs
productName: ShieldBattery-Staging
publish:
  provider: spaces
  name: shieldbattery-staging
  region: nyc3
  path: /app/
