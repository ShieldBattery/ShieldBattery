[package]
name = "server"
version = "0.1.0"
edition = "2024"

default-run = "server"

[lib]
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "gen-schema"
path = "src/bin/gen-schema.rs"

[[bench]]
name = "matchmaker"
harness = false

[dependencies]
arc-swap = "1"
async-graphql = { version = "7.2", features = [
  "chrono",
  "dataloader",
  "tracing",
  "uuid",
] }
async-graphql-axum = "7.2"
async-trait = "0.1"
aws-config = { version = "1.13", features = ["behavior-version-latest"] }
# The default features add `rustls` (a legacy hyper 0.14 + rustls 0.21 client, alongside the
# modern one from `default-https-client`) and `sigv4a` (only used for multi-region access points,
# which S3-compatible providers like DO Spaces don't have).
aws-sdk-s3 = { version = "1.153", default-features = false, features = [
  "default-https-client",
  "http-1x",
  "rt-tokio",
] }
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-client-ip = "1.3"
axum-extra = { version = "0.12", features = ["typed-header"] }
axum-prometheus = "0.10"
base64 = "0.23"
bcrypt = "0.19"
# TODO(2Pac): Pin to a `main` rev once the base-analysis, slot-accessor, `uses_eud` and zlib/bzip2
# PRs are merged there (this rev is the `sb-m6` branch that merges them).
broodmap = { git = "https://github.com/ShieldBattery/broodmap", rev = "4bdbe7d4cfef3633f1f7b795d8415a6952047133" }
broodmap-analysis = { git = "https://github.com/ShieldBattery/broodmap", rev = "4bdbe7d4cfef3633f1f7b795d8415a6952047133" }
broodmap-formats = { git = "https://github.com/ShieldBattery/broodmap", rev = "4bdbe7d4cfef3633f1f7b795d8415a6952047133" }
broodmap-render = { git = "https://github.com/ShieldBattery/broodmap", rev = "4bdbe7d4cfef3633f1f7b795d8415a6952047133" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
data-encoding = "2.11"
deadpool-redis = "0.23"
dotenvy = "0.15"
gethostname = "1.1"
encoding_rs = "0.8"
enumset = "1.1"
hmac = "0.13"
ipnetwork = { version = "0.21", features = ["serde"] }
itertools = "0.15"
jpeg-encoder = "0.7"
jsonwebtoken = { version = "11.1", default-features = false, features = [
  "aws_lc_rs",
] }
metrics = "0.24"
rand = "0.10"
rayon = "1.12"
regex = "1.13"
reqwest = { version = "0.13.5", default-features = false, features = [
  "brotli",
  "deflate",
  "form",
  "gzip",
  "json",
  "rustls",
  "zstd",
] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.24"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2.0"
tokio = { version = "1.54", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-bunyan-formatter = "0.3"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
typeshare = "1.0"
url = { version = "2.5" }
uuid = { version = "1.28", features = ["v4"] }

[dependencies.sqlx]
version = "0.9"
default-features = false
features = [
  "chrono",
  "ipnetwork",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
  "uuid",
]

[dependencies.tower-http]
version = "0.7"
features = [
  "add-extension",
  "compression-deflate",
  "compression-gzip",
  "compression-zstd",
  "cors",
  "normalize-path",
  "request-id",
  "sensitive-headers",
  "timeout",
  "trace",
  "util",
]

[dev-dependencies]
criterion = "0.8"
mockito = "1.7"

# Enable more optimizations for dependencies in dev, but not for our code
[profile.dev.package."*"]
opt-level = 3

# Thin LTO gains a few percent on CPU-heavy paths (see benches/matchmaker.rs) for a modest
# link-time cost. codegen-units = 1 adds little on top of it while making the final (uncached,
# serial) crate build several times slower, so it's intentionally not set here.
[profile.release]
lto = "thin"

[workspace]
