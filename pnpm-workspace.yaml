# Use a shell emulator so POSIX script syntax (e.g. inline env vars) works on Windows
shellEmulator: true
# refuse to install package versions published less than a week ago (supply-chain protection)
minimumReleaseAge: 10080
# first-party packages we publish ourselves don't need the quarantine
minimumReleaseAgeExclude:
  - '@shieldbattery/broodrep'
  # dev-only translation extractor, exact-pinned; its releases are frequent and never reach
  # production
  - 'i18next-cli'
  # build-time only (React Compiler for the client builds); a single version cleared by hand
  - 'oxc-transform-react@0.151.0'
  # its native bindings, which it pins to its own exact version
  - '@oxc-transform-react/*'

peerDependencyRules:
  allowedVersions:
    # plugin-react's caret range on a 0.x version admits only 0.145.x, but it calls nothing that
    # changed since; 0.145.0 and 0.151.0 compile our client identically
    '@vitejs/plugin-react>oxc-transform-react': 0.151.0

overrides:
  '@types/node': 24.13.3
  '@types/koa': ^3.0.3
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@types/unist': ^3.0.3
  parse5: 7.2.1

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  bcrypt: true
  core-js: true
  core-js-pure: true
  electron-winstaller: true
  esbuild: true
  jotai-rolldown: false
  pino-datadog-transport: true
  protobufjs: true
  sharp: true
