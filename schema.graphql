"""
All of the matchmaking types that we support. These values match the enum values used in the database.
"""
scalar MatchmakingType

type MatchupBucket {
	"""
	The season the games fell in, derived from each game's `change_date` the same way the
	rating history derives it.
	"""
	seasonId: Int!
	mapId: SbMapId!
	"""
	The races on the viewed player's side, after random is resolved, in TPZ order within the
	side.
	
	A list rather than a single race because a side is a team composition: 2v2 cells are `tp`
	against `pz` and so on, which is how the client's matrix keys its axes. For a solo mode it
	holds exactly one race. Who played which race isn't recorded, deliberately — that's what
	keeps a 3v3 matrix at 10x10 instead of 27x27.
	"""
	races: [AssignedRace!]!
	"""
	The opposing side's composition, same encoding as `races`.
	"""
	opponentRaces: [AssignedRace!]!
	"""
	Lower edge of the rating band these games fell in, `RATING_BAND_SIZE` wide and clamped
	into `[RATING_BAND_MIN, RATING_BAND_MAX]`. The bottom band is "this and below" and the top
	is "this and above", so the range filter never has to reason about open ends.
	"""
	ratingBand: Int!
	games: Int!
	"""
	Wins out of `games`. Matchmaking records only wins and losses, so `games - wins` is the
	loss count exactly.
	"""
	wins: Int!
}

type MatchupMap {
	id: SbMapId!
	name: String!
	"""
	The map's file, which is where its preview images live.
	
	Resolved through the shared map loaders rather than fetched alongside the buckets: the
	image URLs are built in exactly one place (`MapFile`), it batches with every other map on
	the page, and the buckets stay a pure aggregation with nothing to serialize into the
	global cache.
	
	Never fails the query. This field exists to draw a thumbnail next to a record; a map whose
	file is missing — or whose row won't decode — should cost the picture, not the numbers the
	page is actually for. Failures are logged rather than swallowed silently, since a map file
	that can't be read is worth knowing about even though it isn't worth an error here.
	"""
	mapFile: MapFile
}

type MatchupStats {
	matchmakingType: MatchmakingType!
	"""
	Games attributed to a matchup, which is the sum of every bucket's `games`. Lower than the
	mode's total game count where a game predates the `games_users.team` backfill or was never
	reconciled, since neither can be placed in a cell.
	"""
	totalGames: Int!
	buckets: [MatchupBucket!]!
	"""
	Every map appearing in `buckets`, so the page's map filter can label itself without a
	second request and without the name being repeated on each bucket.
	"""
	maps: [MatchupMap!]!
	"""
	The band grid the buckets are placed on, so the rating filter can lay out its scale from
	the payload instead of hard-coding numbers that would then have two homes.
	"""
	ratingBandSize: Int!
	minRatingBand: Int!
	maxRatingBand: Int!
}

type Mutation {
	"""
	Files a report against another player from a game both users participated in. Any logged-in
	user may call this (subject to the reporting restriction and the per-hour cap).
	"""
	reportGame(input: ReportGameInput!): GameReport!
	"""
	Resolves a report with an outcome (which feeds the credibility stats). Idempotency is
	enforced: a report can only be resolved once.
	"""
	resolveGameReport(id: UUID!, resolution: GameReportResolution!, notes: String): GameReport!
	"""
	Resolves every still-pending sibling report of `id` (same game + reported player, excluding
	`id` itself) with the given resolution — a one-click way to clear the rest of an incident
	after handling one report (typically as `Duplicate`). Reporters are notified per sibling
	exactly as if each had been resolved individually. Returns how many were resolved.
	"""
	resolveSiblingReports(id: UUID!, resolution: GameReportResolution!, notes: String): Int!
	newsCreatePost(post: NewsPostCreation!): NewsPost!
	newsUpdatePost(id: UUID!, updates: NewsPostUpdates!): NewsPost!
	newsDeletePost(id: UUID!): Boolean!
	"""
	Sets (or clears, if message is not provided) the urgent message at the top of the home page.
	"""
	newsSetUrgentMessage(message: UrgentMessageInput): Boolean!
	"""
	Begins linking the current user's Twitch account, returning the Twitch OAuth authorize URL
	the client should open. Completing the flow calls `twitchCompleteLink` with the resulting
	`code` and `state`. `desktop` selects the loopback redirect URI used by the desktop app
	instead of our web callback.
	"""
	twitchStartLink(desktop: Boolean! = false): TwitchLinkStart!
	"""
	Completes linking the current user's Twitch account using the `code` and `state` returned by
	the Twitch OAuth redirect.
	"""
	twitchCompleteLink(code: String!, state: String!): TwitchConnection!
	"""
	Removes the current user's Twitch connection. Returns whether a connection was removed.
	"""
	twitchUnlink: Boolean!
	"""
	Blocks a user's stream from appearing in the live-streams feed (shown on the home page and
	the dedicated live streams page). Idempotent (a repeat block keeps the original). The block
	hides them from the feed only, not from the profile stream card / avatar "live" ring / friend
	notifications. Requires the `manageLiveStreams` permission.
	"""
	blockStream(userId: SbUserId!): Boolean!
	"""
	Removes a user's feed block, letting their stream appear in the feed again. Returns whether a
	block was removed. Requires the `manageLiveStreams` permission.
	"""
	unblockStream(userId: SbUserId!): Boolean!
	userUpdateCurrent(currentPassword: String!, changes: UpdateCurrentUserChanges!): CurrentUser!
	userUpdatePermissions(userId: SbUserId!, permissions: SbPermissionsInput!): SbUser!
	userAddRestrictedName(pattern: String!, kind: RestrictedNameKind!, reason: RestrictedNameReason!): NameRestriction!
	userDeleteRestrictedName(id: Int!): Int!
	userTestRestrictedName(name: String!): NameRestriction
	createSignupCode(input: CreateSignupCodeInput!): SignupCode!
	"""
	Replaces the matchmaker config. Writes the row, appends to `matchmaking_config_history`, and
	hot-reloads the live config so the change takes effect within one search tick. Out-of-range
	values are clamped when the config is loaded, so this won't fail on a bad number.
	"""
	updateMatchmakingConfig(config: MatchmakerConfigInput!): MatchmakerConfigView!
}

