type Query {
	"""
	Fetches a single report by id, for the admin detail view.
	"""
	gameReport(id: UUID!): GameReport
	"""
	Lists game reports for moderation. Unresolved-only by default (newest first); pass
	`includeResolved` to see everything, or `reportedUserId` to see reports against one player.
	"""
	gameReports(filter: GameReportFilter, after: String, before: String, first: Int, last: Int): GameReportConnection!
	game(id: UUID!): Game
	liveGames: [Game!]!
	activeLeagues: [League!]!
	futureLeagues: [League!]!
	pastLeagues: [League!]!
	newsPosts(includeUnpublished: Boolean, after: String, before: String, first: Int, last: Int): NewsPostConnection!
	"""
	Retrieves a single news post by ID. Published posts are visible to everyone; unpublished or
	scheduled posts are only returned to users with the ManageNews permission (for draft preview).
	"""
	newsPost(id: UUID!): NewsPost
	urgentMessage: UrgentMessage
	"""
	The current user's linked Twitch connection, or `null` if they haven't linked one.
	"""
	myTwitchConnection: TwitchConnection
	"""
	ShieldBattery users currently live-streaming StarCraft, ordered by viewer count (highest
	first). Users an admin has blocked from the feed are omitted (the block hides them here only;
	their live state elsewhere -- profile, avatar ring, friend notifications -- is unaffected).
	"""
	liveStreams: [LiveStream!]!
	"""
	Streamers an admin has blocked from the live-streams feed, newest first. For the admin
	blocked-streams management UI.
	"""
	blockedStreams: [BlockedStream!]!
	"""
	The ids of every ShieldBattery user who is currently live-streaming (any category). This lets
	the client badge "live" state across user lists (friends, chat, etc.) from a single lookup,
	with per-stream details fetched lazily via `SbUser.liveStream` where needed. Category-agnostic
	by design, matching the profile "Live" badge (`live_streams` is the StarCraft-filtered feed).
	"""
	liveStreamUserIds: [SbUserId!]!
	user(id: SbUserId!): SbUser
	userByDisplayName(name: String!): SbUser
	currentUser: CurrentUser
	restrictedNames: [NameRestriction!]!
	userLoginNameAuditHistory(userId: SbUserId!, limit: Int, offset: Int): [LoginNameAuditEntry!]!
	userDisplayNameAuditHistory(userId: SbUserId!, limit: Int, offset: Int): [DisplayNameAuditEntry!]!
	signupCodes(includeExhausted: Boolean): [SignupCode!]!
	"""
	The current matchmaker config: stored overrides plus the built-in defaults.
	"""
	matchmakingConfig: MatchmakerConfigView!
	"""
	Every mode a user has ever played ranked, with all-time totals and their standing
	against the last rating they held before this season.
	
	All-time rather than current-season because it drives a page about all-time history:
	sourcing the mode list from the current season's ratings hides a player's whole
	history the moment they skip a season.
	
	The delta is deliberately measured across the season boundary rather than within the
	current season: when a season resets MMR, everyone restarts from the same place, and
	the interesting number is how their standing now compares to what they last held —
	not how far they've climbed back from the reset. It's `None` for a mode first played
	this season, which has nothing to compare against.
	
	Separate from [`user_rating_history`] because the profile shows this on every mode's
	header, including collapsed ones whose history hasn't been fetched.
	"""
	userRankedModes(userId: SbUserId!): [UserRankedMode!]!
	"""
	A user's rating and points over time in a single mode, oldest first.
	"""
	userRatingHistory(userId: SbUserId!, matchmakingType: MatchmakingType!): RatingHistory!
	"""
	A user's record split by race matchup, for one matchmaking mode.
	
	Returned as flat buckets keyed by season, map and the two sides rather than as a
	pre-aggregated matrix: the page filters by season and by map, and every such filter is a
	sum over a subset of these buckets. Sending them once lets the filters resolve locally
	instead of re-querying, and the bucket count is bounded by seasons x maps x cells rather
	than by games played, so it doesn't grow with the length of an account's history.
	"""
	userMatchupStats(userId: SbUserId!, matchmakingType: MatchmakingType!): MatchupStats!
	"""
	The same matrix computed across every player in a mode, for comparing a record against the
	ladder at large.
	
	The payload has the same shape as [`Self::user_matchup_stats`] — same buckets, same maps,
	same band grid — so the page filters it with exactly the same code. One thing differs:
	**every game is counted once per participant**, from that participant's side. A PvZ game
	adds one to PvZ and one to ZvP, which is what makes the matrix readable from either end and
	makes each cell's win rate the win rate of playing that side.
	
	Unlike the per-user query this reads every rated game in the mode, so it's aggregated in
	SQL rather than in memory and the result is cached — see [`GLOBAL_CACHE_TTL_SECONDS`].
	
	Bucket count is seasons x maps x cells x bands, which for the widest mode has a large
	theoretical ceiling. In practice it stays far under it: compositions cluster, and most
	(map, band, season) combinations never see most cells. If a mode ever does approach the
	ceiling, the fix is to take the season and map as arguments and filter in SQL rather than
	to drop a dimension — the client would refetch on those two filters instead of resolving
	them locally.
	"""
	globalMatchupStats(matchmakingType: MatchmakingType!): MatchupStats!
}

