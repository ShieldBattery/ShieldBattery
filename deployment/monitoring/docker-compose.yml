volumes:
    prometheus_data:
    grafana_data:

services:
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    command: >
      sh -c "mkdir -p /dev/net &&
             mknod /dev/net/tun c 10 200 &&
             tailscaled"
    cap_add:
      - NET_ADMIN
    ports:
      - '41641:41641/udp'
    volumes:
      - /var/lib:/var/lib

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    network_mode: service:tailscale
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      # NOTE(grafana-anon-role): Grafana logs that non-Viewer anonymous roles are deprecated
      # ("only viewer role is supported"). The Admin role still applies as of 13.x, but if a
      # future major enforces Viewer, this box has no other login path — the login form is
      # disabled above — so admin/edit access will need a real auth setup at that point.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    network_mode: service:tailscale
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  node_exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: service:tailscale
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
