global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      # The *-rp2-coordinator hostnames: see the rp2_coordinator job below.
      - targets: ['localhost:9100']
        labels:
          environment: monitoring
          host: monitoring
      - targets: ['sb-staging:9100']
        labels:
          environment: staging
          host: sb-staging
      - targets: ['sb-prod:9100']
        labels:
          environment: production
          host: sb-prod
      - targets: ['staging-rp2-coordinator:9100']
        labels:
          environment: staging
          host: staging-rp2-coordinator
      - targets: ['rp2-coordinator:9100']
        labels:
          environment: production
          host: rp2-coordinator

  - job_name: 'app_server'
    static_configs:
      - targets: ['sb-staging:80']
        labels:
          environment: staging
          host: sb-staging
      - targets: ['sb-prod:80']
        labels:
          environment: production
          host: sb-prod

  - job_name: 'server_rs'
    # server-rs serves /metrics as bare text/plain (no version param), which Prometheus otherwise
    # rejects as an unrecognized Content-Type.
    fallback_scrape_protocol: 'PrometheusText0.0.4'
    static_configs:
      - targets: ['sb-staging:8001']
        labels:
          environment: staging
          host: sb-staging
      - targets: ['sb-prod:8001']
        labels:
          environment: production
          host: sb-prod

  # The coordinator boxes' tailnet hostnames (each box's TAILSCALE_HOSTNAME):
  # staging-rp2-coordinator is the staging box; rp2-coordinator is the
  # production box, listed ahead of its standup, so it reads as a down target
  # until that box exists.
  - job_name: 'rp2_coordinator'
    # Same bare text/plain Content-Type situation as the server_rs job.
    fallback_scrape_protocol: 'PrometheusText0.0.4'
    static_configs:
      - targets: ['staging-rp2-coordinator:14911']
        labels:
          environment: staging
          host: staging-rp2-coordinator
      - targets: ['rp2-coordinator:14911']
        labels:
          environment: production
          host: rp2-coordinator
