# necessary so electron-builder can grab the deps for this correctly
# see: https://github.com/electron-userland/electron-builder/issues/6289#issuecomment-1042620422
nodeLinker: hoisted
# refuse to install package versions published less than a week ago (supply-chain protection)
minimumReleaseAge: 10080
# first-party packages we publish ourselves don't need the quarantine
minimumReleaseAgeExclude:
  - '@shieldbattery/broodrep'
  # manually-vetted exception; the exact version pin in package.json keeps resolution from
  # drifting to a fresh release without a deliberate edit
  - better-sqlite3

overrides:
  '@types/node': 24.13.3
  '@types/unist': ^3.0.3

allowBuilds:
  # explicitly denied: the package ships N-API prebuilds (valid for both Node and Electron), so
  # its node-gyp build would only waste time and require a local toolchain
  better-sqlite3: false
  core-js: true
